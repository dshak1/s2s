<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>C — Steppe Horizon</title>
<style>
  :root{
    --steppe:#1e4d8c; --steppe-700:#173c6e; --gold:#ffd700; --warm:#faf6e9;
    --felt:#e8ddc1; --terra:#c8102e; --wolf:#5b6770; --dusk:#e88a6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--warm);font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;color:var(--steppe-700);}
  .page{max-width:1180px;margin:0 auto;padding:56px 48px;}
  .label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:0 0 6px;}
  .word{margin-bottom:54px;}
  .word h1{font-family: Georgia, 'Iowan Old Style', serif; font-weight:700;font-size:44px;margin:0;letter-spacing:-.01em;}
  .word .rule{width:64px;height:4px;background:var(--gold);border-radius:2px;margin-top:10px;}

  .row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:56px;align-items:flex-end;}
  .btn{font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;font-weight:800;font-size:16px;border:none;cursor:pointer;color:#fff;
    padding:15px 30px 22px;position:relative;
    clip-path: polygon(0 0, 100% 0, 100% 68%, 82% 100%, 18% 100%, 0 68%);
  }
  .btn.terra{background:var(--terra);}
  .btn.steppe{background:var(--steppe);}
  .btn.dusk{background:var(--dusk);color:var(--steppe-700);}

  .stage{background:linear-gradient(180deg,#6a5b9e,#e88a6b 55%,#ffce8a);border-radius:18px;padding:40px;position:relative;overflow:hidden;}
  .stage-label{position:absolute;top:18px;left:22px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);}
  .track{display:flex;align-items:center;justify-content:space-between;height:210px;position:relative;}
  .runner{width:64px;height:64px;border-radius:50%;background:var(--warm);border:4px solid var(--gold);
    box-shadow:0 10px 22px rgba(0,0,0,.28);display:grid;place-items:center;font-size:30px;}
  .wall{width:180px;height:210px;position:relative;}
  .wall svg{width:100%;height:100%;display:block;}
  .caption{margin-top:18px;font-size:13px;color:rgba(255,255,255,.85);font-weight:700;text-align:center;}
</style>
</head>
<body>
<div class="page">
  <p class="label">Direction C</p>
  <div class="word">
    <h1>Steppe → Screen</h1>
    <div class="rule"></div>
  </div>

  <div class="row">
    <button class="btn terra">Start the run</button>
    <button class="btn steppe">Run again</button>
    <button class="btn dusk">Tap instead</button>
  </div>

  <div class="stage">
    <span class="stage-label">Wall panel — layered horizon cutout</span>
    <div class="track">
      <div class="runner">🏃</div>
      <div class="wall">
        <svg viewBox="0 0 180 210">
          <defs>
            <mask id="holesC">
              <rect width="180" height="210" fill="white"/>
              <path d="M90 35 C60 35 60 85 90 85 C120 85 120 35 90 35 Z" fill="black"/>
              <path d="M90 105 L118 158 H62 Z" fill="black"/>
              <path d="M55 190 q35 -34 70 0 v14 h-70 Z" fill="black"/>
            </mask>
          </defs>
          <rect width="180" height="210" rx="6" fill="#2b2340" mask="url(#holesC)"/>
          <path d="M0 210 L0 150 Q45 120 90 150 T180 150 V210 Z" fill="#1e4d8c" opacity=".55" mask="url(#holesC)"/>
        </svg>
      </div>
    </div>
    <p class="caption">Layered silhouettes like the app's own mountain art — the wall is scenery, not a UI card.</p>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>B — Flat Kid-App</title>
<style>
  :root{
    --steppe:#1e4d8c; --steppe-700:#173c6e; --gold:#ffd700; --warm:#faf6e9;
    --felt:#e8ddc1; --terra:#c8102e; --wolf:#5b6770; --green:#2f8d47;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#f2f6fb;font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;color:var(--steppe-700);}
  .page{max-width:1180px;margin:0 auto;padding:56px 48px;}
  .label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:0 0 6px;}
  .word{display:flex;align-items:baseline;gap:2px;margin-bottom:54px;}
  .word h1{font-family: system-ui, sans-serif; font-weight:900; font-size:40px;margin:0;letter-spacing:-.01em;color:var(--steppe-700);}
  .word h1 span{color:var(--terra);-webkit-text-stroke:0;}
  .word h1 em{font-style:normal;background:var(--gold);padding:0 8px;border-radius:8px;color:var(--steppe-700);}

  .row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:56px;align-items:flex-start;}
  .btn-wrap{position:relative;}
  .btn{font-family: system-ui, sans-serif; font-weight:800; font-size:17px;border:none;cursor:pointer;
    padding:15px 32px;border-radius:16px;position:relative;z-index:2;color:#fff;display:block;}
  .shadow{position:absolute;inset:0;border-radius:16px;top:6px;z-index:1;}
  .btn.terra{background:var(--terra);} .shadow.terra{background:#970c22;}
  .btn.gold{background:var(--gold);color:var(--steppe-700);} .shadow.gold{background:#c9a900;}
  .btn.green{background:var(--green);} .shadow.green{background:#215f31;}

  .stage{background:linear-gradient(180deg,#bfe6ff,#fff6d8);border-radius:20px;padding:40px;position:relative;overflow:hidden;}
  .stage-label{position:absolute;top:18px;left:22px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(23,60,110,.5);}
  .track{display:flex;align-items:center;justify-content:space-between;height:210px;position:relative;}
  .runner{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--gold);
    box-shadow:0 6px 0 #c9a900;display:grid;place-items:center;font-size:30px;}
  .chevrons{display:flex;gap:6px;position:absolute;left:96px;top:50%;transform:translateY(-50%);}
  .chevrons span{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:12px solid rgba(23,60,110,.28);}
  .wall{width:170px;height:210px;position:relative;}
  .wall svg{width:100%;height:100%;display:block;}
  .caption{margin-top:18px;font-size:13px;color:var(--wolf);font-weight:700;text-align:center;}
</style>
</head>
<body>
<div class="page">
  <p class="label">Direction B</p>
  <div class="word">
    <h1>Steppe<em>2</em>Screen</h1>
  </div>

  <div class="row">
    <div class="btn-wrap"><div class="shadow terra"></div><button class="btn terra">Start the run</button></div>
    <div class="btn-wrap"><div class="shadow gold"></div><button class="btn gold">Run again</button></div>
    <div class="btn-wrap"><div class="shadow green"></div><button class="btn green">Tap instead</button></div>
  </div>

  <div class="stage">
    <span class="stage-label">Wall panel — flat cutout + motion chevrons</span>
    <div class="track">
      <div class="runner">🏃</div>
      <div class="chevrons"><span></span><span></span><span></span></div>
      <div class="wall">
        <svg viewBox="0 0 170 210">
          <defs>
            <mask id="holesB">
              <rect width="170" height="210" fill="white"/>
              <circle cx="85" cy="55" r="30" fill="black"/>
              <path d="M85 120 L115 168 H55 Z" fill="black"/>
              <path d="M55 200 h60 v-14 c0 -18 -60 -18 -60 0 Z" fill="black"/>
            </mask>
          </defs>
          <rect width="170" height="210" rx="14" fill="#1e4d8c" mask="url(#holesB)"/>
        </svg>
      </div>
    </div>
    <p class="caption">Chevrons signal "approaching a barrier"; flat solid panel, no dashed-outline ambiguity.</p>
  </div>
</div>
</body>
</html>

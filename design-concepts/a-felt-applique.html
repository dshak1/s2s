<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>A — Felt Appliqué</title>
<style>
  :root{
    --steppe:#1e4d8c; --steppe-700:#173c6e; --gold:#ffd700; --warm:#faf6e9;
    --felt:#e8ddc1; --terra:#c8102e; --wolf:#5b6770;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--warm);font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;color:var(--steppe-700);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,215,0,.10) 0 2px, transparent 3px),
      radial-gradient(circle at 68% 62%, rgba(30,77,140,.08) 0 2px, transparent 3px),
      radial-gradient(circle at 40% 85%, rgba(255,215,0,.08) 0 2px, transparent 3px);
    background-size: 34px 34px;
  }
  .page{max-width:1180px;margin:0 auto;padding:56px 48px;}
  .label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:0 0 6px;}
  .word{display:flex;align-items:center;gap:14px;margin-bottom:54px;}
  .word .tag{position:relative;width:56px;height:56px;border-radius:50%;background:var(--gold);
    box-shadow:0 5px 0 #c9a900; display:grid;place-items:center;font-family: system-ui, sans-serif; font-weight:800;color:var(--steppe-700);font-size:26px;
    border:3px dashed rgba(23,60,110,.35);}
  .word h1{font-family: system-ui, sans-serif; font-weight:800; font-size:38px;margin:0;letter-spacing:-.01em;}
  .word h1 b{color:var(--terra);}

  .row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:56px;align-items:center;}
  .btn{font-family: system-ui, sans-serif; font-weight:700; font-size:17px;border:none;cursor:pointer;
    padding:16px 30px;border-radius:16px 20px 16px 22px;position:relative;color:var(--warm);
    box-shadow:5px 6px 0 rgba(23,60,110,.55);
    border:3px dashed rgba(255,255,255,.55);
  }
  .btn.primary{background:var(--terra);}
  .btn.gold{background:var(--gold);color:var(--steppe-700);border-color:rgba(23,60,110,.3);box-shadow:5px 6px 0 #c9a900;}
  .btn.ghost{background:var(--felt);color:var(--steppe-700);box-shadow:5px 6px 0 #cbbd94;border-color:rgba(23,60,110,.25);}

  .stage{background:linear-gradient(180deg,#cdeeff,#fff6d8);border-radius:22px;padding:40px;position:relative;overflow:hidden;
    border:2px solid rgba(23,60,110,.08);}
  .stage-label{position:absolute;top:18px;left:22px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(23,60,110,.5);}
  .track{display:flex;align-items:center;justify-content:space-between;height:210px;position:relative;}
  .runner{width:64px;height:64px;border-radius:50%;background:var(--warm);border:4px solid var(--gold);
    box-shadow:0 8px 18px rgba(23,60,110,.25);display:grid;place-items:center;font-size:30px;}
  .wall{width:170px;height:210px;position:relative;}
  .wall svg{width:100%;height:100%;display:block;filter:drop-shadow(4px 6px 0 rgba(23,60,110,.35));}
  .caption{margin-top:18px;font-size:13px;color:var(--wolf);font-weight:700;text-align:center;}
</style>
</head>
<body>
<div class="page">
  <p class="label">Direction A</p>
  <div class="word">
    <div class="tag">2</div>
    <h1>Steppe<b>·</b>Screen</h1>
  </div>

  <div class="row">
    <button class="btn primary">Start the run</button>
    <button class="btn gold">Run again</button>
    <button class="btn ghost">Tap instead</button>
  </div>

  <div class="stage">
    <span class="stage-label">Wall panel — felt appliqué</span>
    <div class="track">
      <div class="runner">🏃</div>
      <div class="wall">
        <svg viewBox="0 0 170 210">
          <defs>
            <mask id="holes">
              <rect width="170" height="210" fill="white"/>
              <path d="M85 40 L100 68 L134 68 L107 88 L118 120 L85 100 L52 120 L63 88 L36 68 L70 68 Z" fill="black"/>
              <path d="M85 130 L115 178 H55 Z" fill="black"/>
            </mask>
          </defs>
          <rect x="4" y="4" width="162" height="202" rx="18" fill="#173c6e" mask="url(#holes)"/>
          <rect x="4" y="4" width="162" height="202" rx="18" fill="none" stroke="#faf6e9" stroke-width="3" stroke-dasharray="7 8"/>
        </svg>
      </div>
    </div>
    <p class="caption">Real cut-through holes — the sky shows through, so "this is a wall you pass through" reads instantly.</p>
  </div>
</div>
</body>
</html>
